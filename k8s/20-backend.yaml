apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: realtime-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Same image built from ./backend/Dockerfile (docker-compose.yml: build.context: ./backend),
          # pushed by the Jenkins pipeline to this exact repo/tag.
          image: docker.io/mdskun/chatapp_backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: realtime-chat
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
