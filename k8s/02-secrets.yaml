# WARNING: This file contains PLACEHOLDER values only.
# The Jenkins pipeline creates/overrides the real "chat-secrets" Secret at deploy
# time (kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -),
# so do NOT put real credentials here or commit them to git.
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
  namespace: realtime-chat
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "change-this-to-a-long-random-secret"
  POSTGRES_PASSWORD: "change-this-postgres-password"
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_PASSWORD: "change-this-admin-password"
  DJANGO_SUPERUSER_EMAIL: "admin@example.com"
